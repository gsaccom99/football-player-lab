name: Refresh all-competitions data

on:
  workflow_dispatch:

  schedule:
    - cron: "47 7 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Football Player Lab
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data dependencies
        run: |
          python -m pip install pandas numpy

      - name: Download latest competition data
        run: |
          git clone \
            --depth 1 \
            https://github.com/olbauday/FPL-Core-Insights.git \
            /tmp/fpl-core-insights

      - name: Rebuild all-competitions dataset
        run: |
          python scripts/refresh_all_competitions.py \
            --source-dir /tmp/fpl-core-insights \
            --output all_competitions_player_stats.csv \
            --metadata all_competitions_metadata.json

      - name: Commit updated data if necessary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            all_competitions_player_stats.csv \
            all_competitions_metadata.json

          if git diff --cached --quiet; then
            echo "No all-competitions data change."
            exit 0
          fi

          git commit -m "Refresh all-competitions data"

          git pull --rebase
          git push
